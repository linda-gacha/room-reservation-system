version: '3.8'

services:
  user-service:
    build: ./back/user-service
    ports:
      - "5000:5000"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/user_db
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - db

  salle-service:
    build: ./back/salle-service
    ports:
      - "5002:5002"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/room_db
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db

  reservation-service:
    build: ./back/reservation-service
    ports:
      - "5003:5003"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/reservation_db
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - kafka
      - db

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=meeting_user
      - POSTGRES_PASSWORD=password
    volumes:
      - db_data:/var/lib/postgresql/data

  kafka:
    image: wurstmeister/kafka:latest
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8085:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-service
      - salle-service
      - reservation-service

volumes:
  db_data:
